name: Validate Files
on: push

jobs:
  validate-files:
    runs-on: ubuntu-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v4

      - name: Validate HTML file
        run: test -f index.html

      - name: Validate JavaScript file
        run: test -f script.js
      - name: Validate js code
        run: node --check script.js
