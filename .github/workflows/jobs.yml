name: Job Tests
on:
  workflow_dispatch
  # workflow_run:
  #   workflows: ["Basic UI"]
  #   types:
  #     - completed

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v4

      - name: Validate HTML file
        run: test -f index.html

  validate-js:
    runs-on: ubuntu-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v4

      - name: Validate JavaScript file
        run: test -f script.js

  validate-code:
    needs: [validate-html, validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v4

      - name: Validate js code
        run: node --check script.js

      - name: Validate html code
        run: npx htmlhint index.html
