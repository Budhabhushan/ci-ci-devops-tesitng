name: "First Workflow"
on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout "
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: install dependency
        run: npm ci

      - name: make react build
        run: npm run build

  deploy_job:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install vercel"
        run: npm i --g vercel

      - name: "Deploy to vercel"
        run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
