name: "First Workflow"
on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: install dependency
        run: npm ci

      - name: "Run ESLint in app"
        run: npm run lint

      - name: "Run unit tests in app"
        run: npm run test

      - name: make react build
        run: npm run build
